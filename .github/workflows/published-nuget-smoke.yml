name: Published NuGet Smoke

on:
  workflow_dispatch:
    inputs:
      package-version:
        description: Published Libmem.NET version to validate from nuget.org
        required: false
        default: 2.5.0
        type: string
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/published-nuget-smoke.yml'
      - 'tests/Libmem.NET.NuGetConsumer/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/published-nuget-smoke.yml'
      - 'tests/Libmem.NET.NuGetConsumer/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  published-nuget-smoke:
    name: Published NuGet x64/x86
    runs-on: windows-2022

    steps:
      - name: Checkout consumer test source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 8 x86 runtime
        shell: pwsh
        run: .\eng\setup-dotnet-x86.ps1

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.package-version }}"
          }
          else {
            # Pull requests and main pushes validate the latest independently verified release.
            # This PR is the public 2.5.0 acceptance gate before merging to main.
            $version = "2.5.0"
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Package version is empty."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Validating published Libmem.NET $version"

      - name: Clear NuGet caches
        shell: pwsh
        run: dotnet nuget locals all --clear

      - name: Restore x64 consumer from nuget.org only
        shell: pwsh
        run: |
          dotnet restore .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            --source https://api.nuget.org/v3/index.json `
            -p:LibmemNetTestPackageVersion=${{ steps.version.outputs.version }} `
            -p:Platform=x64 `
            -p:NuGetAudit=false

      - name: Verify package XML documentation
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $packageRoot = Join-Path $env:USERPROFILE ".nuget\packages\libmem.net\$version"
          foreach ($platform in @("win-x64", "win-x86")) {
            $xml = Join-Path $packageRoot "runtimes\$platform\lib\net8.0\Libmem.NET.xml"
            if (-not (Test-Path $xml -PathType Leaf)) {
              throw "Published NuGet package is missing $platform XML documentation: $xml"
            }
          }

      - name: Build x64 published package consumer
        shell: pwsh
        run: |
          dotnet build .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:Platform=x64 `
            -p:LibmemNetTestPackageVersion=${{ steps.version.outputs.version }}

      - name: Run x64 published package consumer
        shell: pwsh
        run: |
          dotnet run `
            --project .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:Platform=x64 `
            -p:LibmemNetTestPackageVersion=${{ steps.version.outputs.version }}

      - name: Publish and verify x64 runtime assets
        shell: pwsh
        run: |
          $output = ".\artifacts\published-nuget-consumer\x64"
          dotnet publish `
            .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:Platform=x64 `
            -p:LibmemNetTestPackageVersion=${{ steps.version.outputs.version }} `
            -o $output

          foreach ($required in @("Libmem.NET.dll", "libmem.dll", "Ijwhost.dll")) {
            $path = Join-Path $output $required
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Published x64 NuGet consumer is missing $required"
            }
          }

      - name: Restore x86 consumer from nuget.org only
        shell: pwsh
        run: |
          dotnet restore .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            --source https://api.nuget.org/v3/index.json `
            -p:LibmemNetTestPackageVersion=${{ steps.version.outputs.version }} `
            -p:Platform=x86 `
            -p:NuGetAudit=false

      - name: Build x86 published package consumer
        shell: pwsh
        run: |
          dotnet build .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:Platform=x86 `
            -p:LibmemNetTestPackageVersion=${{ steps.version.outputs.version }}

      - name: Run x86 published package consumer
        shell: pwsh
        run: |
          dotnet run `
            --project .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:Platform=x86 `
            -p:LibmemNetTestPackageVersion=${{ steps.version.outputs.version }}

      - name: Publish and verify x86 runtime assets
        shell: pwsh
        run: |
          $output = ".\artifacts\published-nuget-consumer\x86"
          dotnet publish `
            .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:Platform=x86 `
            -p:LibmemNetTestPackageVersion=${{ steps.version.outputs.version }} `
            -o $output

          foreach ($required in @("Libmem.NET.dll", "libmem.dll", "Ijwhost.dll")) {
            $path = Join-Path $output $required
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Published x86 NuGet consumer is missing $required"
            }
          }

      - name: Reject AnyCPU consumer
        shell: pwsh
        run: |
          dotnet build `
            .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:LibmemNetTestPackageVersion=${{ steps.version.outputs.version }} `
            -p:Platform=AnyCPU `
            -p:PlatformTarget=AnyCPU

          if ($LASTEXITCODE -eq 0) {
            throw "Published package unexpectedly accepted an AnyCPU consumer."
          }

          $global:LASTEXITCODE = 0

      - name: Reject unsupported explicit PlatformTarget from nuget.org
        shell: pwsh
        run: |
          foreach ($unsupportedTarget in @("AnyCPU", "arm64")) {
            dotnet build `
              .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
              -c Release `
              --no-restore `
              -p:Platform=x64 `
              -p:PlatformTarget=$unsupportedTarget `
              -p:LibmemNetTestPackageVersion=${{ steps.version.outputs.version }}

            if ($LASTEXITCODE -eq 0) {
              throw "Published NuGet package unexpectedly accepted Platform=x64 with PlatformTarget=$unsupportedTarget."
            }
            $global:LASTEXITCODE = 0
          }
