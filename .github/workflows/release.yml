name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  build-x64:
    uses: ./.github/workflows/reusable-build.yml
    with:
      ref: ${{ github.ref_name }}
      configuration: Release
      platform: x64
      artifact-name: LibmemCli-windows-x64

  release:
    name: Publish release
    needs: [build-x64]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download x64 build artifact
        uses: actions/download-artifact@v4
        with:
          name: LibmemCli-windows-x64
          path: dist/x64

      - name: Validate release package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          EXPECTED_VERSION="${TAG_NAME#v}"
          python eng/verify-package.py --package-dir dist/x64/LibmemCli-windows-x64 --archive dist/x64/LibmemCli-windows-x64.zip --checksum dist/x64/LibmemCli-windows-x64.zip.sha256 --expected-version "$EXPECTED_VERSION" --expected-repository-commit "$GITHUB_SHA" --expected-platform win-x64 --expected-configuration Release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          gh release create "$TAG_NAME" \
            "dist/x64/LibmemCli-windows-x64.zip" \
            "dist/x64/LibmemCli-windows-x64.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG_NAME" \
            --generate-notes

          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" || \
              echo "Warning: release succeeded but the temporary branch could not be deleted."
          fi
