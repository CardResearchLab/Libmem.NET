name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-x64:
    uses: ./.github/workflows/reusable-build.yml
    with:
      ref: ${{ github.ref_name }}
      configuration: Release
      platform: x64
      artifact-name: Libmem.NET-windows-x64
      symbols-artifact-name: Libmem.NET-symbols-windows-x64
      nuget-artifact-name: Libmem.NET-nuget
      include-nuget: true

  release:
    name: Publish release
    needs: [build-x64]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download x64 runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: Libmem.NET-windows-x64
          path: dist/runtime

      - name: Download x64 symbol artifact
        uses: actions/download-artifact@v4
        with:
          name: Libmem.NET-symbols-windows-x64
          path: dist/symbols

      - name: Download NuGet artifact
        uses: actions/download-artifact@v4
        with:
          name: Libmem.NET-nuget
          path: dist/nuget

      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          EXPECTED_VERSION="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate runtime package
        shell: bash
        run: |
          python eng/verify-package.py \
            --package-dir dist/runtime/Libmem.NET-windows-x64 \
            --archive dist/runtime/Libmem.NET-windows-x64.zip \
            --checksum dist/runtime/Libmem.NET-windows-x64.zip.sha256 \
            --expected-version "${{ steps.release-version.outputs.version }}" \
            --expected-repository-commit "$GITHUB_SHA" \
            --expected-platform win-x64 \
            --expected-configuration Release

      - name: Validate Windows symbol package
        shell: bash
        run: |
          test -f dist/symbols/Libmem.NET-symbols-windows-x64/Libmem.NET.pdb
          (
            cd dist/symbols
            sha256sum -c Libmem.NET-symbols-windows-x64.zip.sha256
          )

      - name: Validate NuGet package
        shell: bash
        run: |
          PACKAGE="dist/nuget/Libmem.NET.${{ steps.release-version.outputs.version }}.nupkg"
          test -f "$PACKAGE" || {
            echo "Expected NuGet package is missing: $PACKAGE"
            exit 1
          }

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish Libmem.NET to nuget.org
        shell: bash
        run: |
          dotnet nuget push "dist/nuget/Libmem.NET.${{ steps.release-version.outputs.version }}.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Render formal release notes
        shell: bash
        run: |
          python eng/render-release-notes.py \
            --version "${{ steps.release-version.outputs.version }}" \
            --changelog CHANGELOG.md \
            --manifest dist/runtime/Libmem.NET-windows-x64/manifest.json \
            --checksum dist/runtime/Libmem.NET-windows-x64.zip.sha256 \
            --repository "$GITHUB_REPOSITORY" \
            --tag "${{ steps.release-version.outputs.tag }}" \
            --output dist/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.release-version.outputs.tag }}" \
            "dist/runtime/Libmem.NET-windows-x64.zip" \
            "dist/runtime/Libmem.NET-windows-x64.zip.sha256" \
            "dist/symbols/Libmem.NET-symbols-windows-x64.zip" \
            "dist/symbols/Libmem.NET-symbols-windows-x64.zip.sha256" \
            "dist/nuget/Libmem.NET.${{ steps.release-version.outputs.version }}.nupkg" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Libmem.NET ${{ steps.release-version.outputs.tag }}" \
            --notes-file dist/release-notes.md

          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" || \
              echo "Warning: release succeeded but the temporary branch could not be deleted."
          fi
