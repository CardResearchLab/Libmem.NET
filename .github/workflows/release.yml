name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  build-x64:
    uses: ./.github/workflows/reusable-build.yml
    with:
      ref: ${{ github.ref_name }}
      configuration: Release
      platform: x64
      artifact-name: LibmemCli-windows-x64

  build-x86:
    uses: ./.github/workflows/reusable-build.yml
    with:
      ref: ${{ github.ref_name }}
      configuration: Release
      platform: x86
      artifact-name: LibmemCli-windows-x86

  release:
    name: Publish release
    needs: [build-x64, build-x86]
    runs-on: ubuntu-latest

    steps:
      - name: Download x64 build artifact
        uses: actions/download-artifact@v4
        with:
          name: LibmemCli-windows-x64
          path: dist/x64

      - name: Download x86 build artifact
        uses: actions/download-artifact@v4
        with:
          name: LibmemCli-windows-x86
          path: dist/x86

      - name: Validate release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          PACKAGE_VERSION_X64="$(tr -d '\r\n' < dist/x64/LibmemCli-windows-x64/VERSION)"
          PACKAGE_VERSION_X86="$(tr -d '\r\n' < dist/x86/LibmemCli-windows-x86/VERSION)"
          EXPECTED_VERSION="${TAG_NAME#v}"

          if [[ "$PACKAGE_VERSION_X64" != "$EXPECTED_VERSION" || "$PACKAGE_VERSION_X86" != "$EXPECTED_VERSION" ]]; then
            echo "Release ref $TAG_NAME does not match package versions x64=$PACKAGE_VERSION_X64 x86=$PACKAGE_VERSION_X86" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          gh release create "$TAG_NAME" \
            "dist/x64/LibmemCli-windows-x64.zip" \
            "dist/x86/LibmemCli-windows-x86.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG_NAME" \
            --generate-notes

          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" || \
              echo "Warning: release succeeded but the temporary branch could not be deleted."
          fi
