name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-x64:
    uses: ./.github/workflows/reusable-build.yml
    with:
      ref: ${{ github.ref_name }}
      configuration: Release
      platform: x64
      artifact-name: LibmemCli-windows-x64
      include-nuget: true

  release:
    name: Publish release
    needs: [build-x64]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download x64 build artifact
        uses: actions/download-artifact@v4
        with:
          name: LibmemCli-windows-x64
          path: dist/x64

      - name: Validate release package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          EXPECTED_VERSION="${TAG_NAME#v}"
          python eng/verify-package.py --package-dir dist/x64/LibmemCli-windows-x64 --archive dist/x64/LibmemCli-windows-x64.zip --checksum dist/x64/LibmemCli-windows-x64.zip.sha256 --expected-version "$EXPECTED_VERSION" --expected-repository-commit "$GITHUB_SHA" --expected-platform win-x64 --expected-configuration Release

      - name: Validate NuGet package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          EXPECTED_VERSION="${TAG_NAME#v}"
          PACKAGE="dist/x64/Libmem.NET.${EXPECTED_VERSION}.nupkg"

          test -f "$PACKAGE" || {
            echo "Expected NuGet package is missing: $PACKAGE"
            exit 1
          }

      - name: NuGet login (OIDC)
        if: github.ref_type == 'tag'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish Libmem.NET to nuget.org
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          EXPECTED_VERSION="${TAG_NAME#v}"
          dotnet nuget push "dist/x64/Libmem.NET.${EXPECTED_VERSION}.nupkg"             --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"             --source https://api.nuget.org/v3/index.json             --skip-duplicate

      - name: Render formal release notes
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          EXPECTED_VERSION="${TAG_NAME#v}"
          python eng/render-release-notes.py \
            --version "$EXPECTED_VERSION" \
            --changelog CHANGELOG.md \
            --manifest dist/x64/LibmemCli-windows-x64/manifest.json \
            --checksum dist/x64/LibmemCli-windows-x64.zip.sha256 \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG_NAME" \
            --output dist/release-notes.md

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG_NAME="$GITHUB_REF_NAME"

          gh release create "$TAG_NAME" \
            "dist/x64/LibmemCli-windows-x64.zip" \
            "dist/x64/LibmemCli-windows-x64.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Libmem.NET $TAG_NAME" \
            --notes-file dist/release-notes.md

      - name: Release dry run complete
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          echo "Release branch validation completed successfully."
          echo "No GitHub Release or nuget.org package was published."
          echo "Create a matching v* tag to perform the real publication."
