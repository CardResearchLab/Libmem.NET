name: Release

on:
  workflow_dispatch:
    inputs:
      publish-nuget:
        description: Publish an existing tagged GitHub release to nuget.org (select its v* tag)
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  contents: write
  id-token: write

# Never allow two release/publish runs for the same ref to execute at once.
# A later accidental manual trigger waits instead of cancelling an in-flight publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-x64:
    uses: ./.github/workflows/reusable-build.yml
    with:
      ref: ${{ github.ref_name }}
      configuration: Release
      platform: x64
      artifact-name: Libmem.NET-windows-x64

  build-x86:
    uses: ./.github/workflows/reusable-build.yml
    with:
      ref: ${{ github.ref_name }}
      configuration: Release
      platform: x86
      artifact-name: Libmem.NET-windows-x86

  package-nuget:
    name: Package multi-arch NuGet
    needs: [build-x64, build-x86]
    runs-on: windows-2022

    steps:
      - name: Checkout release source for NuGet
        uses: actions/checkout@v4

      - name: Setup .NET 8 for NuGet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python for NuGet
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download x64 runtime for NuGet
        uses: actions/download-artifact@v4
        with:
          name: Libmem.NET-windows-x64
          path: artifacts/package

      - name: Download x86 runtime for NuGet
        uses: actions/download-artifact@v4
        with:
          name: Libmem.NET-windows-x86
          path: artifacts/package

      - name: Build exact-version NuGet package
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          .\eng\package-nuget.ps1 -Configuration Release -PackageVersion $version

      - name: Upload NuGet release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Libmem.NET-nuget
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/package-version.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [build-x64, build-x86, package-nuget]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate release ref
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_NUGET: ${{ inputs.publish-nuget == true }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == release/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
          else
            echo "Select a v* tag or release/v* branch; ordinary branches cannot publish."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF_TYPE" == "tag" && "$PUBLISH_NUGET" != "true" ]]; then
            echo "Manual runs on an existing v* tag are reserved for NuGet publication. Enable publish-nuget; GitHub Releases are created by the tag push."
            exit 1
          fi
          if [[ "$PUBLISH_NUGET" == "true" ]]; then
            test "$GITHUB_REF_TYPE" = "tag" || { echo "NuGet publication requires an existing tag."; exit 1; }
            gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download x64 build artifact
        uses: actions/download-artifact@v4
        with:
          name: Libmem.NET-windows-x64
          path: dist/x64

      - name: Download x86 build artifact
        uses: actions/download-artifact@v4
        with:
          name: Libmem.NET-windows-x86
          path: dist/x86

      - name: Download NuGet build artifact
        uses: actions/download-artifact@v4
        with:
          name: Libmem.NET-nuget
          path: dist/nuget

      - name: Validate release packages
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          EXPECTED_VERSION="${TAG_NAME#v}"
          python eng/verify-package.py --package-dir dist/x64/Libmem.NET-windows-x64 --archive dist/x64/Libmem.NET-windows-x64.zip --checksum dist/x64/Libmem.NET-windows-x64.zip.sha256 --expected-version "$EXPECTED_VERSION" --expected-repository-commit "$GITHUB_SHA" --expected-platform win-x64 --expected-configuration Release
          python eng/verify-package.py --package-dir dist/x86/Libmem.NET-windows-x86 --archive dist/x86/Libmem.NET-windows-x86.zip --checksum dist/x86/Libmem.NET-windows-x86.zip.sha256 --expected-version "$EXPECTED_VERSION" --expected-repository-commit "$GITHUB_SHA" --expected-platform win-x86 --expected-configuration Release

      - name: Download published NuGet asset for later push
        if: github.event_name == 'workflow_dispatch' && inputs.publish-nuget == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "Libmem.NET.${EXPECTED_VERSION}.nupkg" --dir dist/nuget --clobber

      - name: Validate NuGet package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          EXPECTED_VERSION="${TAG_NAME#v}"
          PACKAGE="dist/nuget/Libmem.NET.${EXPECTED_VERSION}.nupkg"

          test -f "$PACKAGE" || {
            echo "Expected NuGet package is missing: $PACKAGE"
            exit 1
          }
          python tests/verify_nuget_package.py --package "$PACKAGE" --expected-version "$EXPECTED_VERSION" --expected-commit "$GITHUB_SHA"

      - name: Render formal release notes
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          EXPECTED_VERSION="${TAG_NAME#v}"
          python eng/render-release-notes.py \
            --version "$EXPECTED_VERSION" \
            --changelog CHANGELOG.md \
            --manifest-x64 dist/x64/Libmem.NET-windows-x64/manifest.json \
            --checksum-x64 dist/x64/Libmem.NET-windows-x64.zip.sha256 \
            --manifest-x86 dist/x86/Libmem.NET-windows-x86/manifest.json \
            --checksum-x86 dist/x86/Libmem.NET-windows-x86.zip.sha256 \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG_NAME" \
            --output dist/release-notes.md

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' && inputs.publish-nuget != true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            TAG_NAME="${GITHUB_REF_NAME#release/}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          RELEASE_FLAGS=()
          if [[ "${TAG_NAME#v}" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi

          gh release create "$TAG_NAME" \
            "dist/x64/Libmem.NET-windows-x64.zip" \
            "dist/x64/Libmem.NET-windows-x64.zip.sha256" \
            "dist/x86/Libmem.NET-windows-x86.zip" \
            "dist/x86/Libmem.NET-windows-x86.zip.sha256" \
            "dist/nuget/Libmem.NET.${TAG_NAME#v}.nupkg" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Libmem.NET $TAG_NAME" \
            --notes-file dist/release-notes.md \
            "${RELEASE_FLAGS[@]}"

      - name: Release dry run complete
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          echo "Release branch validation completed successfully."
          echo "No GitHub Release or nuget.org package was published."
          echo "Create a matching v* tag for GitHub downloads; publish NuGet separately by manual opt-in."

      - name: NuGet login (OIDC)
        if: github.event_name == 'workflow_dispatch' && inputs.publish-nuget == true
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish Libmem.NET to nuget.org
        if: github.event_name == 'workflow_dispatch' && inputs.publish-nuget == true
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          dotnet nuget push "dist/nuget/Libmem.NET.${EXPECTED_VERSION}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
