name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release ${{ matrix.platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check wrapper contract
        shell: pwsh
        run: python .\tests\check_sources.py

      - name: Build LibmemCli
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform ${{ matrix.platform }}

      - name: Run runtime smoke tests
        shell: pwsh
        run: dotnet run --project .\tests\LibmemCli.SmokeTests\LibmemCli.SmokeTests.csproj -c Release -p:Platform=${{ matrix.platform }}

      - name: Package runtime
        shell: pwsh
        run: .\eng\package-runtime.ps1 -Configuration Release -Platform ${{ matrix.platform }}

      - name: Verify runtime package
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          python .\eng\verify-package.py --package-dir .\artifacts\package\LibmemCli-windows-${{ matrix.platform }} --archive .\artifacts\package\LibmemCli-windows-${{ matrix.platform }}.zip --checksum .\artifacts\package\LibmemCli-windows-${{ matrix.platform }}.zip.sha256 --expected-repository-commit $commit --expected-platform win-${{ matrix.platform }} --expected-configuration Release

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibmemCli-windows-${{ matrix.platform }}
          path: |
            artifacts/package/LibmemCli-windows-${{ matrix.platform }}/
            artifacts/package/LibmemCli-windows-${{ matrix.platform }}.zip
            artifacts/package/LibmemCli-windows-${{ matrix.platform }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
