name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug:
        description: Also build and smoke-test Debug x64
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check wrapper contract
        shell: pwsh
        run: python .\tests\check_sources.py

      - name: Build Libmem.NET Debug x64
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        shell: pwsh
        run: .\build.ps1 -Configuration Debug -Platform x64

      - name: Build Libmem.NET Release x64
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform x64

      - name: Run runtime smoke tests
        shell: pwsh
        run: dotnet run --project .\tests\Libmem.NET.SmokeTests\Libmem.NET.SmokeTests.csproj -c Release -p:Platform=x64

      - name: Run Debug runtime smoke tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        shell: pwsh
        run: dotnet run --project .\tests\Libmem.NET.SmokeTests\Libmem.NET.SmokeTests.csproj -c Debug -p:Platform=x64

      - name: Run C# example
        shell: pwsh
        run: dotnet .\samples\bin\x64\Release\net8.0\Example.dll

      - name: Build external-process TestTarget
        shell: pwsh
        run: dotnet build .\tests\Libmem.NET.TestTarget\Libmem.NET.TestTarget.csproj -c Release -p:Platform=x64

      - name: Run external-process runtime tests
        shell: pwsh
        env:
          LIBMEM_NET_TEST_TARGET_DLL: ${{ github.workspace }}\tests\Libmem.NET.TestTarget\bin\x64\Release\net8.0\Libmem.NET.TestTarget.dll
        run: dotnet run --project .\tests\Libmem.NET.ExternalProcessTests\Libmem.NET.ExternalProcessTests.csproj -c Release -p:Platform=x64

      - name: Run Hook and VMT runtime tests
        shell: pwsh
        run: dotnet run --project .\tests\Libmem.NET.HookVmtTests\Libmem.NET.HookVmtTests.csproj -c Release -p:Platform=x64

      - name: Run Injector runtime tests
        shell: pwsh
        run: dotnet run --project .\tests\Libmem.NET.InjectorTests\Libmem.NET.InjectorTests.csproj -c Release -p:Platform=x64

      - name: Pack and verify local NuGet prototype
        shell: pwsh
        run: .\eng\package-nuget.ps1 -Configuration Release

      - name: Restore NuGet consumer from local feed
        shell: pwsh
        run: |
          $version = (Get-Content .\artifacts\nuget\package-version.txt -Raw).Trim()
          dotnet restore .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            --source .\artifacts\nuget `
            -p:LibmemNetTestPackageVersion=$version `
            -p:NuGetAudit=false

      - name: Run NuGet consumer
        shell: pwsh
        run: |
          $version = (Get-Content .\artifacts\nuget\package-version.txt -Raw).Trim()
          dotnet run `
            --project .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:LibmemNetTestPackageVersion=$version

      - name: Publish NuGet consumer
        shell: pwsh
        run: |
          $version = (Get-Content .\artifacts\nuget\package-version.txt -Raw).Trim()
          $output = ".\artifacts\nuget-consumer-publish"
          dotnet publish `
            .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:LibmemNetTestPackageVersion=$version `
            -o $output

          foreach ($required in @("Libmem.NET.dll", "libmem.dll", "Ijwhost.dll")) {
            $path = Join-Path $output $required
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Published NuGet consumer is missing $required"
            }
          }

      - name: Reject non-x64 NuGet consumer
        shell: pwsh
        run: |
          $version = (Get-Content .\artifacts\nuget\package-version.txt -Raw).Trim()
          dotnet build `
            .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:LibmemNetTestPackageVersion=$version `
            -p:PlatformTarget=AnyCPU

          if ($LASTEXITCODE -eq 0) {
            throw "NuGet prototype unexpectedly accepted a non-x64 consumer."
          }

          $global:LASTEXITCODE = 0

      - name: Package runtime
        shell: pwsh
        run: .\eng\package-runtime.ps1 -Configuration Release -Platform x64

      - name: Verify runtime package
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          python .\eng\verify-package.py --package-dir .\artifacts\package\Libmem.NET-windows-x64 --archive .\artifacts\package\Libmem.NET-windows-x64.zip --checksum .\artifacts\package\Libmem.NET-windows-x64.zip.sha256 --expected-repository-commit $commit --expected-platform win-x64 --expected-configuration Release

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: Libmem.NET-windows-x64
          path: |
            artifacts/package/Libmem.NET-windows-x64/
            artifacts/package/Libmem.NET-windows-x64.zip
            artifacts/package/Libmem.NET-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
