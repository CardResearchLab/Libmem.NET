name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check wrapper contract
        shell: pwsh
        run: python .\tests\check_sources.py

      - name: Build Libmem.NET
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform x64

      - name: Run runtime smoke tests
        shell: pwsh
        run: dotnet run --project .\tests\LibmemCli.SmokeTests\LibmemCli.SmokeTests.csproj -c Release -p:Platform=x64

      - name: Package runtime
        shell: pwsh
        run: .\eng\package-runtime.ps1 -Configuration Release -Platform x64

      - name: Verify runtime package
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          python .\eng\verify-package.py --package-dir .\artifacts\package\Libmem.NET-windows-x64 --archive .\artifacts\package\Libmem.NET-windows-x64.zip --checksum .\artifacts\package\Libmem.NET-windows-x64.zip.sha256 --expected-repository-commit $commit --expected-platform win-x64 --expected-configuration Release

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: Libmem.NET-windows-x64
          path: |
            artifacts/package/Libmem.NET-windows-x64/
            artifacts/package/Libmem.NET-windows-x64.zip
            artifacts/package/Libmem.NET-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
