name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check wrapper contract
        shell: pwsh
        run: python .\tests\check_sources.py

      - name: Build LibmemCli
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform x64

      - name: Run runtime smoke tests
        shell: pwsh
        run: dotnet run --project .\tests\LibmemCli.SmokeTests\LibmemCli.SmokeTests.csproj -c Release -p:Platform=x64

      - name: Package runtime
        shell: pwsh
        run: .\eng\package-runtime.ps1 -Configuration Release -Platform x64

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibmemCli-windows-x64
          path: |
            artifacts/package/LibmemCli-windows-x64/
            artifacts/package/LibmemCli-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
