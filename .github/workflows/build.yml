name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug:
        description: Also build and smoke-test Debug x64
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check wrapper contract
        shell: pwsh
        run: python .\tests\check_sources.py

      - name: Build Libmem.NET Debug x64
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        shell: pwsh
        run: .\build.ps1 -Configuration Debug -Platform x64

      - name: Build Libmem.NET Release x64
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform x64

      - name: Run runtime smoke tests
        shell: pwsh
        run: dotnet run --project .\tests\Libmem.NET.SmokeTests\Libmem.NET.SmokeTests.csproj -c Release -p:Platform=x64

      - name: Run Debug runtime smoke tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        shell: pwsh
        run: dotnet run --project .\tests\Libmem.NET.SmokeTests\Libmem.NET.SmokeTests.csproj -c Debug -p:Platform=x64

      - name: Run C# example
        shell: pwsh
        run: dotnet .\samples\bin\x64\Release\net8.0\Example.dll

      - name: Run Hook lifecycle sample
        shell: pwsh
        run: dotnet run --project .\samples\HookLifecycle\HookLifecycle.csproj -c Release -p:Platform=x64

      - name: Build external-process TestTarget
        shell: pwsh
        run: dotnet build .\tests\Libmem.NET.TestTarget\Libmem.NET.TestTarget.csproj -c Release -p:Platform=x64

      - name: Run external-process runtime tests
        shell: pwsh
        env:
          LIBMEM_NET_TEST_TARGET: ${{ github.workspace }}\tests\Libmem.NET.TestTarget\bin\x64\Release\net8.0\Libmem.NET.TestTarget.exe
        run: dotnet run --project .\tests\Libmem.NET.ExternalProcessTests\Libmem.NET.ExternalProcessTests.csproj -c Release -p:Platform=x64

      - name: Run Hook and VMT runtime tests
        shell: pwsh
        run: dotnet run --project .\tests\Libmem.NET.HookVmtTests\Libmem.NET.HookVmtTests.csproj -c Release -p:Platform=x64

      - name: Run Injector runtime tests
        shell: pwsh
        run: dotnet run --project .\tests\Libmem.NET.InjectorTests\Libmem.NET.InjectorTests.csproj -c Release -p:Platform=x64

      - name: Package runtime
        shell: pwsh
        run: .\eng\package-runtime.ps1 -Configuration Release -Platform x64

      - name: Verify runtime package
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          python .\eng\verify-package.py --package-dir .\artifacts\package\Libmem.NET-windows-x64 --archive .\artifacts\package\Libmem.NET-windows-x64.zip --checksum .\artifacts\package\Libmem.NET-windows-x64.zip.sha256 --expected-repository-commit $commit --expected-platform win-x64 --expected-configuration Release

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: Libmem.NET-windows-x64
          path: |
            artifacts/package/Libmem.NET-windows-x64/
            artifacts/package/Libmem.NET-windows-x64.zip
            artifacts/package/Libmem.NET-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  x86:
    name: Release x86
    runs-on: windows-2022

    steps:
      - name: Checkout x86
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8 SDK for x86
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 8 x86 runtime
        shell: pwsh
        run: .\eng\setup-dotnet-x86.ps1

      - name: Build Libmem.NET Release x86
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform x86

      - name: Run x86 runtime smoke tests
        shell: pwsh
        run: dotnet run --project .\tests\Libmem.NET.SmokeTests\Libmem.NET.SmokeTests.csproj -c Release -p:Platform=x86

      - name: Build x86 external-process TestTarget
        shell: pwsh
        run: dotnet build .\tests\Libmem.NET.TestTarget\Libmem.NET.TestTarget.csproj -c Release -p:Platform=x86

      - name: Run x86 external-process runtime tests
        shell: pwsh
        env:
          LIBMEM_NET_TEST_TARGET: ${{ github.workspace }}\tests\Libmem.NET.TestTarget\bin\x86\Release\net8.0\Libmem.NET.TestTarget.exe
        run: dotnet run --project .\tests\Libmem.NET.ExternalProcessTests\Libmem.NET.ExternalProcessTests.csproj -c Release -p:Platform=x86

      - name: Run x86 Hook and VMT runtime tests
        shell: pwsh
        run: dotnet run --project .\tests\Libmem.NET.HookVmtTests\Libmem.NET.HookVmtTests.csproj -c Release -p:Platform=x86

      - name: Run x86 Injector runtime tests
        shell: pwsh
        run: dotnet run --project .\tests\Libmem.NET.InjectorTests\Libmem.NET.InjectorTests.csproj -c Release -p:Platform=x86

      - name: Package x86 runtime
        shell: pwsh
        run: .\eng\package-runtime.ps1 -Configuration Release -Platform x86

      - name: Verify x86 runtime package
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          python .\eng\verify-package.py --package-dir .\artifacts\package\Libmem.NET-windows-x86 --archive .\artifacts\package\Libmem.NET-windows-x86.zip --checksum .\artifacts\package\Libmem.NET-windows-x86.zip.sha256 --expected-repository-commit $commit --expected-platform win-x86 --expected-configuration Release

      - name: Upload x86 runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: Libmem.NET-windows-x86
          path: |
            artifacts/package/Libmem.NET-windows-x86/
            artifacts/package/Libmem.NET-windows-x86.zip
            artifacts/package/Libmem.NET-windows-x86.zip.sha256
          if-no-files-found: error
          retention-days: 14

  nuget:
    name: Multi-arch NuGet
    needs: [build, x86]
    runs-on: windows-2022

    steps:
      - name: Checkout NuGet source
        uses: actions/checkout@v4

      - name: Setup .NET 8 for NuGet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 8 x86 runtime for NuGet
        shell: pwsh
        run: .\eng\setup-dotnet-x86.ps1

      - name: Setup Python for NuGet
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download x64 runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: Libmem.NET-windows-x64
          path: artifacts/package

      - name: Download x86 runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: Libmem.NET-windows-x86
          path: artifacts/package

      - name: Pack and verify multi-architecture NuGet
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          .\eng\package-nuget.ps1 -Configuration Release -PackageVersion $version

      - name: Restore x64 NuGet consumer
        shell: pwsh
        run: |
          $version = (Get-Content .\artifacts\nuget\package-version.txt -Raw).Trim()
          dotnet restore .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            --source .\artifacts\nuget `
            -p:LibmemNetTestPackageVersion=$version `
            -p:Platform=x64 `
            -p:NuGetAudit=false

      - name: Run x64 NuGet consumer
        shell: pwsh
        run: |
          $version = (Get-Content .\artifacts\nuget\package-version.txt -Raw).Trim()
          dotnet run `
            --project .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:Platform=x64 `
            -p:LibmemNetTestPackageVersion=$version

      - name: Publish x64 NuGet consumer
        shell: pwsh
        run: |
          $version = (Get-Content .\artifacts\nuget\package-version.txt -Raw).Trim()
          $output = ".\artifacts\nuget-consumer-publish\x64"
          dotnet publish `
            .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:Platform=x64 `
            -p:LibmemNetTestPackageVersion=$version `
            -o $output

          foreach ($required in @("Libmem.NET.dll", "libmem.dll", "Ijwhost.dll")) {
            if (-not (Test-Path (Join-Path $output $required) -PathType Leaf)) {
              throw "Published x64 NuGet consumer is missing $required"
            }
          }

      - name: Restore x86 NuGet consumer
        shell: pwsh
        run: |
          $version = (Get-Content .\artifacts\nuget\package-version.txt -Raw).Trim()
          dotnet restore .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            --source .\artifacts\nuget `
            -p:LibmemNetTestPackageVersion=$version `
            -p:Platform=x86 `
            -p:NuGetAudit=false

      - name: Run x86 NuGet consumer
        shell: pwsh
        run: |
          $version = (Get-Content .\artifacts\nuget\package-version.txt -Raw).Trim()
          dotnet run `
            --project .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:Platform=x86 `
            -p:LibmemNetTestPackageVersion=$version

      - name: Publish x86 NuGet consumer
        shell: pwsh
        run: |
          $version = (Get-Content .\artifacts\nuget\package-version.txt -Raw).Trim()
          $output = ".\artifacts\nuget-consumer-publish\x86"
          dotnet publish `
            .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:Platform=x86 `
            -p:LibmemNetTestPackageVersion=$version `
            -o $output

          foreach ($required in @("Libmem.NET.dll", "libmem.dll", "Ijwhost.dll")) {
            if (-not (Test-Path (Join-Path $output $required) -PathType Leaf)) {
              throw "Published x86 NuGet consumer is missing $required"
            }
          }

      - name: Reject AnyCPU NuGet consumer
        shell: pwsh
        run: |
          $version = (Get-Content .\artifacts\nuget\package-version.txt -Raw).Trim()
          dotnet build `
            .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:Platform=AnyCPU `
            -p:PlatformTarget=AnyCPU `
            -p:LibmemNetTestPackageVersion=$version

          if ($LASTEXITCODE -eq 0) {
            throw "NuGet package unexpectedly accepted an AnyCPU consumer."
          }

          $global:LASTEXITCODE = 0

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: Libmem.NET-nuget
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/package-version.txt
          if-no-files-found: error
          retention-days: 14

