name: Hook VMT Runtime Tests

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        type: choice
        required: true
        default: x64
        options:
          - x64
          - x86

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hook-vmt:
    name: Hook and VMT ${{ inputs.platform }}
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 8 x86 runtime
        if: inputs.platform == 'x86'
        shell: pwsh
        run: .\eng\setup-dotnet-x86.ps1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check wrapper contract
        shell: pwsh
        run: python .\tests\check_sources.py

      - name: Build Libmem.NET
        shell: pwsh
        run: '.\build.ps1 -Configuration Release -Platform "${{ inputs.platform }}"'

      - name: Run Hook and VMT runtime tests
        shell: pwsh
        run: 'dotnet run --project .\tests\Libmem.NET.HookVmtTests\Libmem.NET.HookVmtTests.csproj -c Release -p:Platform="${{ inputs.platform }}"'
