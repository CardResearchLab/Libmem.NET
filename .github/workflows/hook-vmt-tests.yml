name: Hook VMT Runtime Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/Libmem.NET.HookVmtTests/**'
      - 'tests/check_sources.py'
      - 'eng/**'
      - 'build.ps1'
      - '.gitmodules'
      - '.github/workflows/hook-vmt-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hook-vmt:
    name: Hook and VMT x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check wrapper contract
        shell: pwsh
        run: python .\tests\check_sources.py

      - name: Build Libmem.NET
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform x64

      - name: Run Hook and VMT runtime tests
        shell: pwsh
        run: dotnet run --project .\tests\Libmem.NET.HookVmtTests\Libmem.NET.HookVmtTests.csproj -c Release -p:Platform=x64
