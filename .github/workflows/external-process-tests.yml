name: External Process Runtime Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/Core/**'
      - 'src/Memory/**'
      - 'src/Scanning/**'
      - 'src/Interop/**'
      - 'tests/LibmemCli.TestTarget/**'
      - 'tests/LibmemCli.ExternalProcessTests/**'
      - 'build.ps1'
      - '.gitmodules'
      - '.github/workflows/external-process-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  external-process:
    name: External Process x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check wrapper contract
        shell: pwsh
        run: python .\tests\check_sources.py

      - name: Build LibmemCli
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform x64

      - name: Build external-process TestTarget
        shell: pwsh
        run: dotnet build .\tests\LibmemCli.TestTarget\LibmemCli.TestTarget.csproj -c Release -p:Platform=x64

      - name: Run external-process runtime tests
        shell: pwsh
        env:
          LIBMEMCLI_TEST_TARGET_DLL: ${{ github.workspace }}\tests\LibmemCli.TestTarget\bin\x64\Release\net8.0\LibmemCli.TestTarget.dll
        run: dotnet run --project .\tests\LibmemCli.ExternalProcessTests\LibmemCli.ExternalProcessTests.csproj -c Release -p:Platform=x64
