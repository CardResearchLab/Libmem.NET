name: Reusable build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref of HearthstoneModding/Libmem to build
        required: false
        default: main
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      platform:
        description: Target platform (x64 or x86)
        required: false
        default: x64
        type: string
      artifact-name:
        description: Uploaded artifact name
        required: false
        default: LibmemCli-windows-x64
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build LibmemCli
    runs-on: windows-2022

    steps:
      - name: Checkout Libmem
        uses: actions/checkout@v4
        with:
          repository: HearthstoneModding/Libmem
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          architecture: ${{ inputs.platform }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check wrapper contract
        shell: pwsh
        run: python .\tests\check_sources.py

      - name: Build
        shell: pwsh
        run: '.\build.ps1 -Configuration "${{ inputs.configuration }}" -Platform "${{ inputs.platform }}"'

      - name: Run runtime smoke tests
        shell: pwsh
        run: 'dotnet run --project .\tests\LibmemCli.SmokeTests\LibmemCli.SmokeTests.csproj -c "${{ inputs.configuration }}" -p:Platform="${{ inputs.platform }}"'

      - name: Package runtime
        shell: pwsh
        run: '.\eng\package-runtime.ps1 -Configuration "${{ inputs.configuration }}" -Platform "${{ inputs.platform }}"'

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            artifacts/package/LibmemCli-windows-${{ inputs.platform }}/
            artifacts/package/LibmemCli-windows-${{ inputs.platform }}.zip
          if-no-files-found: error
          retention-days: 14
