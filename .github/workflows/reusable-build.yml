name: Reusable build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref of CardResearchLab/Libmem.NET to build
        required: false
        default: main
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      platform:
        description: Target platform (x64 or x86)
        required: false
        default: x64
        type: string
      artifact-name:
        description: Uploaded runtime artifact name
        required: false
        default: Libmem.NET-windows-x64
        type: string
      include-nuget:
        description: Also create the multi-architecture Libmem.NET NuGet package
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build Libmem.NET
    runs-on: windows-2022

    steps:
      - name: Checkout Libmem.NET
        uses: actions/checkout@v4
        with:
          repository: CardResearchLab/Libmem.NET
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 8 x86 runtime
        if: inputs.platform == 'x86' || inputs.include-nuget
        shell: pwsh
        run: .\eng\setup-dotnet-x86.ps1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check wrapper contract
        shell: pwsh
        run: python .\tests\check_sources.py

      - name: Build
        shell: pwsh
        run: '.\build.ps1 -Configuration "${{ inputs.configuration }}" -Platform "${{ inputs.platform }}"'

      - name: Run runtime smoke tests
        shell: pwsh
        run: 'dotnet run --project .\tests\Libmem.NET.SmokeTests\Libmem.NET.SmokeTests.csproj -c "${{ inputs.configuration }}" -p:Platform="${{ inputs.platform }}"'

      - name: Package runtime
        shell: pwsh
        run: '.\eng\package-runtime.ps1 -Configuration "${{ inputs.configuration }}" -Platform "${{ inputs.platform }}"'

      - name: Verify runtime package
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          python .\eng\verify-package.py --package-dir .\artifacts\package\Libmem.NET-windows-${{ inputs.platform }} --archive .\artifacts\package\Libmem.NET-windows-${{ inputs.platform }}.zip --checksum .\artifacts\package\Libmem.NET-windows-${{ inputs.platform }}.zip.sha256 --expected-repository-commit $commit --expected-platform win-${{ inputs.platform }} --expected-configuration "${{ inputs.configuration }}"

      - name: Build secondary architecture for NuGet
        if: inputs.include-nuget
        shell: pwsh
        run: |
          $secondary = if ("${{ inputs.platform }}" -eq "x64") { "x86" } else { "x64" }
          .\build.ps1 -Configuration "${{ inputs.configuration }}" -Platform $secondary
          dotnet run --project .\tests\Libmem.NET.SmokeTests\Libmem.NET.SmokeTests.csproj -c "${{ inputs.configuration }}" -p:Platform=$secondary

      - name: Package official NuGet release
        if: inputs.include-nuget
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          .\eng\package-nuget.ps1 -Configuration "${{ inputs.configuration }}" -PackageVersion $version
          Copy-Item .\artifacts\nuget\*.nupkg .\artifacts\package\ -Force

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            artifacts/package/Libmem.NET-windows-${{ inputs.platform }}/
            artifacts/package/Libmem.NET-windows-${{ inputs.platform }}.zip
            artifacts/package/Libmem.NET-windows-${{ inputs.platform }}.zip.sha256
            ${{ inputs.include-nuget && 'artifacts/package/*.nupkg' || '' }}
          if-no-files-found: error
          retention-days: 14
