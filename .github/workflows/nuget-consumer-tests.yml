name: NuGet Consumer Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuget-consumer:
    name: NuGet Consumer x64 + x86
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 8 x86 runtime
        shell: pwsh
        run: .\eng\setup-dotnet-x86.ps1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check wrapper contract
        shell: pwsh
        run: python .\tests\check_sources.py

      - name: Build Libmem.NET x64
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform x64

      - name: Build Libmem.NET x86
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform x86

      - name: Pack and verify local NuGet package
        shell: pwsh
        run: .\eng\package-nuget.ps1 -Configuration Release

      - name: Restore and run NuGet consumers
        shell: pwsh
        run: |
          $version = (Get-Content .\artifacts\nuget\package-version.txt -Raw).Trim()

          foreach ($platform in @("x64", "x86")) {
            dotnet restore .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
              --source .\artifacts\nuget `
              -p:LibmemNetTestPackageVersion=$version `
              -p:Platform=$platform `
              -p:NuGetAudit=false
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet consumer restore failed for $platform."
            }

            dotnet run `
              --project .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
              -c Release `
              --no-restore `
              -p:LibmemNetTestPackageVersion=$version `
              -p:Platform=$platform
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet consumer run failed for $platform."
            }
          }

      - name: Publish NuGet consumers
        shell: pwsh
        run: |
          $version = (Get-Content .\artifacts\nuget\package-version.txt -Raw).Trim()

          foreach ($platform in @("x64", "x86")) {
            $output = ".\artifacts\nuget-consumer-publish\$platform"
            dotnet publish `
              .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
              -c Release `
              --no-restore `
              -p:LibmemNetTestPackageVersion=$version `
              -p:Platform=$platform `
              -o $output
            if ($LASTEXITCODE -ne 0) {
              throw "NuGet consumer publish failed for $platform."
            }

            foreach ($required in @("Libmem.NET.dll", "libmem.dll", "Ijwhost.dll")) {
              $requiredPath = Join-Path $output $required
              if (-not (Test-Path $requiredPath -PathType Leaf)) {
                throw "Published $platform NuGet consumer is missing $required"
              }
            }
          }

      - name: Reject AnyCPU NuGet consumer
        shell: pwsh
        run: |
          $version = (Get-Content .\artifacts\nuget\package-version.txt -Raw).Trim()
          dotnet build `
            .\tests\Libmem.NET.NuGetConsumer\Libmem.NET.NuGetConsumer.csproj `
            -c Release `
            --no-restore `
            -p:LibmemNetTestPackageVersion=$version `
            -p:PlatformTarget=AnyCPU

          if ($LASTEXITCODE -eq 0) {
            throw "NuGet package unexpectedly accepted an AnyCPU consumer."
          }

          $global:LASTEXITCODE = 0
